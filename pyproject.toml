[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "psycopg[binary]>=3.2,<4", "python-dotenv>=1.2,<2", "uvicorn>=0.30,<1", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
drive = ["google-api-python-client>=2,<3", "google-auth-httplib2>=0.2,<1", "httplib2>=0.22,<1"]

[tool.setuptools.packages.find]
include = ["server*"]
exclude = ["server.tests*"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]

[tool.setuptools.package-data]
server = ["schema.sql"]
