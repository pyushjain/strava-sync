name: Daily Drive ingestion

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-drive-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -c requirements.lock '.[drive]'
      - name: Ingest Google Drive export
        env:
          DOPPLER_SERVICE_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          STRAVA_SYNC_ARCHIVE: ${{ runner.temp }}/strava-sync-archive
        run: python -m server.doppler_ingest
